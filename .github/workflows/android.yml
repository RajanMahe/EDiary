name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kurippidu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release
    # Runs only for version tags like v1.4.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KURIPPIDU_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed AAB and APK
        env:
          KURIPPIDU_KEYSTORE_FILE: release.jks
          KURIPPIDU_KEYSTORE_PASSWORD: ${{ secrets.KURIPPIDU_KEYSTORE_PASSWORD }}
          KURIPPIDU_KEY_ALIAS: ${{ secrets.KURIPPIDU_KEY_ALIAS }}
          KURIPPIDU_KEY_PASSWORD: ${{ secrets.KURIPPIDU_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: kurippidu-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and UI tests (with coverage)
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: List failing tests
        # Shows each failing test as an error note on the run page,
        # so failures are visible without downloading the report.
        if: failure()
        shell: python3 {0}
        run: |
          import glob, os, xml.etree.ElementTree as ET
          lines = []
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is None:
                      continue
                  name = f"{case.get('classname', '').split('.')[-1]} > {case.get('name')}"
                  message = (problem.get("message") or problem.text or "").strip()[:400]
                  # The first frames from our code (and any "Caused by") say where it broke
                  stack = [l.strip() for l in (problem.text or "").splitlines()
                           if "com.aburv" in l or l.strip().startswith("Caused by")][:12]
                  if stack:
                      message += "\n" + "\n".join(stack)
                  lines.append(f"- **{name}**: {message}")
                  print(f"::error title={name}::{message.replace(chr(10), '%0A')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Failing tests\n\n" + ("\n".join(lines) or "None found (see the log)") + "\n")

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/coverage/test/debug/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kurippidu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release
    # Runs only for version tags like v1.4.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KURIPPIDU_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed AAB and APK
        env:
          KURIPPIDU_KEYSTORE_FILE: release.jks
          KURIPPIDU_KEYSTORE_PASSWORD: ${{ secrets.KURIPPIDU_KEYSTORE_PASSWORD }}
          KURIPPIDU_KEY_ALIAS: ${{ secrets.KURIPPIDU_KEY_ALIAS }}
          KURIPPIDU_KEY_PASSWORD: ${{ secrets.KURIPPIDU_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: kurippidu-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
